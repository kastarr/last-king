  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta name="format-detection" content="telephone=no">
  <title>Magnificent (@magnificent_og) • Instagram</title>
  <link rel="icon" href="assets/monogram.svg" type="image/svg+xml">
  <script>
    /*
     * Deterministic scene selection:
     *   ?scene=27 -> profile and party grid (default)
     *   ?scene=41 -> Club Extreme post detail
     * The query parameter is removed after the state is captured so production
     * controls never appear in the photographed address bar.
     */
    (function () {
      var params = new URLSearchParams(window.location.search);
      var scene = params.get("scene") === "41" ? "41" : "27";
      document.documentElement.dataset.scene = scene;
      if (params.has("scene")) {
        params.delete("scene");
        var query = params.toString();
        var clean = window.location.pathname + (query ? "?" + query : "") + window.location.hash;
        try {
          window.history.replaceState({ scene: scene }, "", clean);
        } catch (error) {
          /* file:// contexts can reject replaceState; the scene still renders. */
        }
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --blue: #0095f6;
      --link: #00376b;
      --ink: #000000;
      --muted: #737373;
      --line: #dbdbdb;
      --line-soft: #efefef;
      --surface: #ffffff;
      --wash: #fafafa;
      --avatar-size: clamp(84px, 23.2vw, 96px);
    }

    * { box-sizing: border-box; }

    html {
      width: 100%;
      background: var(--surface);
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100%;
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    img, svg { display: block; }
    img { max-width: 100%; }
    button { font: inherit; color: inherit; }
    p { margin: 0; }
    ul { margin: 0; padding: 0; list-style: none; }

    .app {
      width: 100%;
      max-width: 470px;
      margin-inline: auto;
      background: var(--surface);
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .icon {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
    }

    .wordmark {
      font-family: "Snell Roundhand", "Apple Chancery", "Segoe Script", "Brush Script MT", cursive;
      font-size: 32px;
      font-style: italic;
      font-weight: 700;
      line-height: .95;
      letter-spacing: -.045em;
      white-space: nowrap;
      transform: translateY(-1px);
    }

    /* ---------- Profile ---------- */

    .view-profile {
      padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
      background: var(--surface);
    }

    .ig-topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: calc(env(safe-area-inset-top, 0px) + 7px) 16px 7px;
      background: var(--surface);
      border-bottom: 1px solid var(--line-soft);
    }

    .topbar-auth {
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
    }

    .auth-login {
      color: var(--blue);
      font-size: 14px;
      font-weight: 600;
    }

    .auth-signup {
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--blue);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
    }

    .profile-header {
      display: grid;
      grid-template-columns: var(--avatar-size) minmax(0, 1fr);
      align-items: center;
      column-gap: 18px;
      padding: 18px 16px 0;
    }

    .avatar-ring {
      width: var(--avatar-size);
      aspect-ratio: 1;
      padding: 3px;
      border-radius: 50%;
      background: conic-gradient(from 210deg, #f7b733, #fc4a1a 22%, #d62976 48%, #962fbf 70%, #4f5bd5 86%, #f7b733);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      padding: 2px;
      border-radius: 50%;
      background: var(--surface);
    }

    .avatar-mark {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .profile-id {
      min-width: 0;
    }

    .profile-id-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .handle {
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: clamp(17px, 4.6vw, 19px);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -.02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .verified {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .profile-more {
      width: 24px;
      height: 24px;
      margin-left: auto;
      color: #262626;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 3px;
      margin-top: 13px;
    }

    .stat {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat-number {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -.01em;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .profile-bio {
      padding: 12px 16px 0;
    }

    .display-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .bio {
      margin-top: 1px;
      font-size: 14px;
      line-height: 1.35;
    }

    .profile-link {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      margin-top: 5px;
      color: var(--link);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
    }

    .profile-link .icon {
      width: 14px;
      height: 14px;
    }

    .profile-link span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-actions {
      display: flex;
      gap: 8px;
      padding: 14px 16px 0;
    }

    .profile-button {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }

    .profile-button.follow {
      flex: 1;
      border-color: var(--blue);
      background: var(--blue);
      color: #ffffff;
      -webkit-text-fill-color: #ffffff;
    }

    .profile-button.message {
      flex: 1;
      border-color: var(--line);
      color: var(--ink);
      -webkit-text-fill-color: var(--ink);
    }

    .profile-button.add-person {
      width: 44px;
      flex: 0 0 44px;
      padding: 0;
      color: var(--ink);
      -webkit-text-fill-color: var(--ink);
    }

    .add-person .icon {
      width: 20px;
      height: 20px;
    }

    button:disabled {
      opacity: 1;
      cursor: default;
    }

    .highlights {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      overflow-x: auto;
      padding: 16px 16px 10px;
      scrollbar-width: none;
    }

    .highlights::-webkit-scrollbar { display: none; }

    .highlight {
      flex: 0 0 66px;
      text-align: center;
      scroll-snap-align: start;
    }

    .highlight-ring {
      display: block;
      width: 62px;
      height: 62px;
      margin-inline: auto;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
    }

    .highlight-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .highlight-label {
      display: block;
      margin-top: 6px;
      overflow: hidden;
      color: var(--ink);
      font-size: 10.5px;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .profile-tabs {
      display: flex;
      height: 48px;
      border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line);
    }

    .profile-tab {
      position: relative;
      display: grid;
      flex: 1;
      place-items: center;
      color: #8e8e8e;
    }

    .profile-tab[aria-current="page"] { color: var(--ink); }

    .profile-tab[aria-current="page"]::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 64px;
      height: 1px;
      transform: translateX(-50%);
      background: var(--ink);
    }

    .profile-tab .icon {
      width: 24px;
      height: 24px;
    }

    .post-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 2px;
    }

    .post-grid li { min-width: 0; }

    .grid-post {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: var(--line-soft);
      line-height: 0;
      cursor: pointer;
    }

    .grid-post img {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      transition: opacity 120ms ease-out;
    }

    .grid-post:focus-visible {
      z-index: 2;
      outline: 2px solid var(--blue);
      outline-offset: -2px;
    }

    @media (hover: hover) and (pointer: fine) {
      .grid-post:hover img { opacity: .92; }
    }

    .bottom-nav {
      position: fixed;
      inset-inline: 0;
      bottom: 0;
      z-index: 40;
      display: flex;
      width: 100%;
      max-width: 470px;
      height: calc(50px + env(safe-area-inset-bottom, 0px));
      margin-inline: auto;
      padding: 0 12px env(safe-area-inset-bottom, 0px);
      align-items: center;
      justify-content: space-around;
      border-top: 1px solid var(--line-soft);
      background: var(--surface);
      pointer-events: none;
    }

    .bottom-nav .icon {
      width: 25px;
      height: 25px;
      color: #000000;
    }

      display: none;
      min-height: 100svh;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      background: var(--surface);
    }

    html[data-scene="41"] .view-post { display: block; }

    .post-topbar {

      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      min-height: 52px;
      padding: calc(env(safe-area-inset-top, 0px) + 4px) 8px 4px;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--surface);
    }

    .post-topbar .wordmark {
      justify-self: center;
      font-size: 26px;
    }

    .post-back {
      display: flex;
      min-width: 44px;
      min-height: 44px;
      padding: 0 8px;
      align-items: center;
      gap: 1px;
      justify-self: start;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #262626;
      font-size: 15px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
    }

    .post-back .icon {
      width: 24px;
      height: 24px;
    }

    .post-back:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    @media (hover: hover) and (pointer: fine) {
      .post-back:hover { background: var(--wash); }
    }

    .post-topbar-spacer {
      width: 44px;
      justify-self: end;
    }

    .post {
      background: var(--surface);
    }

    .post-head {
      display: flex;
      min-height: 56px;
      padding: 10px 16px;
      align-items: center;
      gap: 10px;
    }

    .post-avatar {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      overflow: hidden;
      border-radius: 50%;
      background: #050505;
    }

    .post-avatar .mark {
      width: 100%;
      height: 100%;
    }

    .post-head-copy {
      min-width: 0;
      flex: 1;
    }

    .post-handle {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
    }

    .post-handle .verified {
      width: 14px;
      height: 14px;
    }

    .post-location {
      margin-top: 1px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .post-location[hidden] { display: none; }

    .post-more {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      color: #262626;
    }

    .post-media {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: var(--line-soft);
    }

    .post-media.is-wide {
      aspect-ratio: 852 / 436;
    }

    .post-actions {
      display: flex;
      padding: 4px 8px;
      align-items: center;
    }

    .post-action {
      display: grid;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      border: 0;
      background: transparent;
      color: #262626;
    }

    .post-action .icon {
      width: 24px;
      height: 24px;
    }

    .post-save { margin-left: auto; }

    .post-likes {
      margin: 2px 16px 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .post-caption {
      margin: 4px 16px 0;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.43;
    }

    .post-author { font-weight: 600; }

    .mention {
      color: var(--link);
      font-weight: 500;
    }

    .post-comments {
      margin: 5px 16px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .post-time {
      margin: 5px 16px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    [hidden] { display: none !important; }

    @media (min-width: 600px) {
      .app {
        max-width: 470px;
        border-inline: 1px solid var(--line-soft);
      }
      .bottom-nav { border-inline: 1px solid var(--line-soft); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0s !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";

      var root = document.documentElement;
      var postHost = document.getElementById("post-host");
      var postTemplate = document.getElementById("post-template");
      var backButton = document.getElementById("post-back");
      var status = document.getElementById("scene-status");
      var gridButtons = Array.prototype.slice.call(document.querySelectorAll(".grid-post"));
      var lastTrigger = null;

      var POSTS = {
        "club-extreme": {
          image: "assets/club-extreme.jpg",
          width: 852,
          height: 436,
          wide: true,
          alt: "Magnificent in sunglasses raises a hand while holding a red cup in a crowded club, with a neon EXTREME sign behind him.",
          location: "Club Extreme, Lagos",
          likes: "128,754 likes",
          comments: "View all 3,726 comments",
          time: "2 days ago",
          caption: "This week in honour of our fifth anniversary we do it every night at @ClubExtremeLagos"
        },
        "party-02": {
          image: "assets/party-02.jpg",
          width: 280,
          height: 268,
          alt: "Three women in sunglasses pose together in a blue-lit club."
        },
        "party-03": {
          image: "assets/party-03.jpg",
          width: 283,
          height: 268,
          alt: "A man in a white shirt smiles in a club lounge."
        },
        "party-04": {
          image: "assets/party-04.jpg",
          width: 284,
          height: 262,
          alt: "A woman in a green dress dances in a crowded club."
        },
        "party-05": {
          image: "assets/party-05.jpg",
          width: 280,
          height: 262,
          alt: "A gold M monogram glows above a club table."
        },
        "party-06": {
          image: "assets/party-06.jpg",
          width: 283,
          height: 262,
          alt: "Two women in black and red dresses pose in a club."
        },
        "party-07": {
          image: "assets/party-07.jpg",
          width: 284,
          height: 184,
          alt: "Three friends hold red cups together at a club table."
        },
        "party-08": {
          image: "assets/party-08.jpg",
          width: 280,
          height: 184,
          alt: "A woman in a black halter dress dances under blue club lights."
        },
        "party-09": {
          image: "assets/party-09.jpg",
          width: 283,
          height: 184,
          alt: "A club crowd raises their hands toward the stage lights."
        }
      };

      function captionNode(text) {
        var fragment = document.createDocumentFragment();
        var pieces = text.split(/(@ClubExtremeLagos)/g);
        pieces.forEach(function (piece) {
          if (!piece) return;
          if (piece === "@ClubExtremeLagos") {
            var mention = document.createElement("span");
            mention.className = "mention";
            mention.textContent = piece;
            fragment.appendChild(mention);
          } else {
            fragment.appendChild(document.createTextNode(piece));
          }
        });
        return fragment;
      }

      function buildPost(post) {
        var node = postTemplate.content.firstElementChild.cloneNode(true);
        var image = node.querySelector(".post-media");
        image.src = post.image;
        image.alt = post.alt;
        image.width = post.width;
        image.height = post.height;
        if (post.wide) image.classList.add("is-wide");

        var location = node.querySelector(".post-location");
        if (post.location) {
          location.textContent = post.location;
        } else {
          location.hidden = true;
        }

        var likes = node.querySelector(".post-likes");
        if (post.likes) {
          likes.querySelector("strong").textContent = post.likes;
        } else {
          likes.hidden = true;
        }

        var caption = node.querySelector(".post-caption");
        if (post.caption) {
          caption.querySelector(".post-caption-text").appendChild(captionNode(post.caption));
        } else {
          caption.hidden = true;
        }

        var comments = node.querySelector(".post-comments");
        if (post.comments) {
          comments.querySelector("span").textContent = post.comments;
        } else {
          comments.hidden = true;
        }

        var time = node.querySelector(".post-time");
        if (post.time) {
          time.querySelector("time").textContent = post.time;
        } else {
          time.hidden = true;
        }

        return node;
      }

      function renderPost(post) {
        var fragment = document.createDocumentFragment();
        fragment.appendChild(buildPost(post));
        postHost.replaceChildren(fragment);
      }

      function openPost(id, trigger, options) {
        var post = POSTS[id];
        if (!post) return;
        lastTrigger = trigger || lastTrigger;
        renderPost(post);
        root.dataset.scene = "41";
        if (status) status.textContent = "Showing Magnificent's post.";
        window.scrollTo(0, 0);
        if (!options || options.focus !== false) {
          window.requestAnimationFrame(function () {
            backButton.focus({ preventScroll: true });
          });
        }
      }

      function closePost(options) {
        if (root.dataset.scene !== "41") return;
        root.dataset.scene = "27";
        postHost.replaceChildren();
        if (status) status.textContent = "Showing Magnificent's profile.";
        var target = lastTrigger || gridButtons[0];
        window.scrollTo(0, 0);
        if (!options || options.focus !== false) {
          window.requestAnimationFrame(function () {
            if (target) target.focus();
          });
        }
      }

      gridButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          openPost(button.getAttribute("data-post-id"), button);
        });
      });

      backButton.addEventListener("click", function () {
        closePost();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && root.dataset.scene === "41") {
          event.preventDefault();
          closePost();
        }
      });

      if (root.dataset.scene === "41") {
        openPost("club-extreme", null, { focus: false });
      } else {
        if (status) status.textContent = "Showing Magnificent's profile.";
      }
    })();
  </script>
